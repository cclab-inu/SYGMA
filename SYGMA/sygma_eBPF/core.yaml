apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: core
  namespace: default
  labels:
    daemonset: core
spec:
  selector:
    matchLabels:
      container: core
  template:
    metadata:
      labels:
        container: core
    spec:
      tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      hostPID: true
      # hostNetwork: true
      containers:
      - image: localhost/sygma/core:artifact-v1
        imagePullPolicy: Never
        name: core
        env:
        - name: SYGMA_OBSERVATION_MODE
          value: "true"
        - name: REDIS_ADDR
          value: "redis-service.default.svc.cluster.local:6379"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true                   #  
          runAsUser: 0                       # root 
          runAsNonRoot: false                # root 
          allowPrivilegeEscalation: true     #   
          readOnlyRootFilesystem: false      #    
        volumeMounts:
        - name: docker-socket-file # docker (read-only)
          mountPath: /var/run/docker.sock
          readOnly: true
        - name: containerd-socket-file
          mountPath: /var/run/containerd/containerd.sock
          readOnly: true
        - name: usr-src-path # BPF (read-only)
          mountPath: /usr/src
        - name: sys-path 
          mountPath: /sys/
        - name: sys-kernel-debug-path 
          mountPath: /sys/kernel/debug
        - name: loader-lock-path
          mountPath: /var/lib/sygma
          mountPropagation: HostToContainer
      volumes:
      - name: docker-socket-file # docker
        hostPath:
          path: /var/run/docker.sock
      - name: containerd-socket-file
        hostPath:
          path: /var/run/containerd/containerd.sock
      - name: usr-src-path # BPF
        hostPath:
          path: /usr/src
          type: Directory
      - name: sys-path
        hostPath:
          path: /sys/
          type: Directory
      - name: sys-kernel-debug-path 
        hostPath:
          path: /sys/kernel/debug
          type: Directory
      - name: loader-lock-path
        hostPath:
          path: /var/lib/sygma
          type: DirectoryOrCreate
