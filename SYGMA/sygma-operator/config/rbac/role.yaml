---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - security.security.io
  resources:
  - sygmaconfigs
  - sygmapolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.security.io
  resources:
  - sygmaconfigs/finalizers
  - sygmapolicies/finalizers
  verbs:
  - update
- apiGroups:
  - security.security.io
  resources:
  - sygmaconfigs/status
  - sygmapolicies/status
  verbs:
  - get
  - patch
  - update
