---
# SYGMA Config Operator - Standalone Deployment
#    eBPF   

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sygma-config-operator
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sygma-config-operator
rules:
  # SYGMAConfig 
  - apiGroups: ["security.security.io"]
    resources: ["sygmaconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["security.security.io"]
    resources: ["sygmaconfigs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["security.security.io"]
    resources: ["sygmaconfigs/finalizers"]
    verbs: ["update"]
  # Collection Pod 
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader Election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sygma-config-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sygma-config-operator
subjects:
  - kind: ServiceAccount
    name: sygma-config-operator
    namespace: default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sygma-config-operator
  namespace: default
  labels:
    app: sygma-config-operator
    app.kubernetes.io/name: sygma
    app.kubernetes.io/component: config-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sygma-config-operator
  strategy:
    type: Recreate  # Leader election   
  template:
    metadata:
      labels:
        app: sygma-config-operator
        app.kubernetes.io/name: sygma
        app.kubernetes.io/component: config-operator
    spec:
      serviceAccountName: sygma-config-operator
      
      # Standalone : Control Plane   toleration
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      
      # Control Plane  ()
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      
      containers:
        - name: manager
          image: localhost/sygma-q2/operator:artifact-v1
          imagePullPolicy: Never
          command:
            - /manager
          args:
            - --mode=config                           # Config Operator 
            - --leader-elect=true
            - --redis-addr=$(REDIS_ADDR)
            - --health-probe-bind-address=:8081
          env:
            - name: REDIS_ADDR
              value: "redis-service.default:6379"
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
          securityContext:
            # ⭐ eBPF    privileged 
            privileged: true
          volumeMounts:
            # ⭐ eBPF  
            - name: bpf-maps
              mountPath: /sys/fs/bpf
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      
      volumes:
        # ⭐ eBPF  
        - name: bpf-maps
          hostPath:
            path: /sys/fs/bpf
            type: Directory