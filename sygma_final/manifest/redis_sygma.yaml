apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # ⭐   
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      
      # ⭐   
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
            - matchExpressions:
              - key: node-role.kubernetes.io/master
                operator: Exists
      
      # ⭐ Taint 
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          hostPort: 6379  # ⭐   
          name: redis
        command:
        - redis-server
        args:
        - --bind
        - 0.0.0.0  # ⭐   
        - --maxmemory
        - 400mb
        - --maxmemory-policy
        - allkeys-lru
        - --protected-mode
        - "no"  # ⭐    ( )
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
