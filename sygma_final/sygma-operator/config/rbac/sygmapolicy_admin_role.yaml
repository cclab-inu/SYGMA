# This rule is not used by the project sygma-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over security.security.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sygma-operator
    app.kubernetes.io/managed-by: kustomize
  name: sygmapolicy-admin-role
rules:
- apiGroups:
  - security.security.io
  resources:
  - sygmapolicies
  verbs:
  - '*'
- apiGroups:
  - security.security.io
  resources:
  - sygmapolicies/status
  verbs:
  - get
