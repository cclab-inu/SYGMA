apiVersion: apps/v1
kind: Deployment
metadata:
  name: sygma-policy-redis
  namespace: default
  labels:
    app.kubernetes.io/name: sygma-policy-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sygma-policy-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sygma-policy-redis
    spec:
      # ⭐   
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      
      # ⭐   
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
            - matchExpressions:
              - key: node-role.kubernetes.io/master
                operator: Exists
      
      # ⭐ Taint 
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          hostPort: 6379  # ⭐   
          name: redis
        command:
        - redis-server
        args:
        - --bind
        - 0.0.0.0  # ⭐   
        - --maxmemory
        - 400mb
        - --maxmemory-policy
        - noeviction
        - --protected-mode
        - "no"  # ⭐    ( )
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: default
  labels:
    app.kubernetes.io/name: sygma-policy-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sygma-policy-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
