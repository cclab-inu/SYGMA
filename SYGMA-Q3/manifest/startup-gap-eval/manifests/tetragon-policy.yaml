apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: observe-application-syscalls
  namespace: sygma-gap-eval
  labels:
    app.kubernetes.io/part-of: sygma-startup-gap-eval
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sygma-gap-probe
      gap.sygma.io/backend: tetragon
  containerSelector:
    matchExpressions:
      - key: name
        operator: In
        values:
          - probe
  tracepoints:
    - subsystem: raw_syscalls
      event: sys_enter
      args:
        - index: 4
          type: int64
      selectors:
        - matchActions:
            # Positive, non-blocking evidence that the selector matched. The
            # exporter delivery timestamp is not used as a readiness clock.
            - action: Post
              rateLimit: 10s
              rateLimitScope: process
