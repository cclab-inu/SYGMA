apiVersion: security.security.io/v1
kind: SYGMAConfig
metadata:
  name: sygmaconfig-state-machine
spec:
  collection:
    yamlContent: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: sygma-state-machine-workload
      spec:
        restartPolicy: Never
        containers:
        - name: nginx
          image: nginx:1.27
  policy:
    stateMachine:
      initialState: 0
      states:
        "0":
          allowedSyscalls: [0, 1, 3, 9, 10, 11, 12, 16, 21, 60, 231, 257, 262]
        "1":
          allowedSyscalls: [0, 1, 3, 9, 10, 11, 12, 16, 21, 60, 231, 257, 262]
      transitions:
        "0":
          "257": 1
        "1":
          "3": 0
